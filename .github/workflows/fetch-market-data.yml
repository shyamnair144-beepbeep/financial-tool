name: Fetch Market Data Daily

on:
  schedule:
    # Run every day at 6:30 PM IST (1:00 PM UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Indian market data
        run: |
          echo "📡 Updating market data with default values..."
          echo "Note: Live fetching disabled - using curated default values"

          # Use default values (manually update these monthly if needed)
          NIFTY_PRICE=22000
          NIFTY_CHANGE=0.5
          NSE_PE=22.5
          NSE_PB=4.2

          # Create market-data.json
          cat > market-data.json << 'EOF'
          {
            "source": "GitHub Actions (Daily Update)",
            "timestamp": TIMESTAMP_PLACEHOLDER,
            "lastUpdated": "DATETIME_PLACEHOLDER",
            "niftyPrice": 22000,
            "niftyChange": 0.5,
            "niftyPE": 22.5,
            "niftyPB": 4.2,
            "indiaVIX": 15.5,
            "repoRate": 6.5,
            "cpiInflation": 5.1,
            "usdInr": 83.2,
            "crudeOil": 75.0,
            "goldPrice": 62500,
            "note": "Default market values - Update manually if needed"
          }
          EOF

          # Replace placeholders with actual values
          TIMESTAMP=$(date +%s)000
          DATETIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          sed -i "s/TIMESTAMP_PLACEHOLDER/$TIMESTAMP/" market-data.json
          sed -i "s/DATETIME_PLACEHOLDER/$DATETIME/" market-data.json

          echo "✅ market-data.json created with default values"
          cat market-data.json

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          git add market-data.json

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update market data - $(date -u +"%Y-%m-%d %H:%M UTC")"
            git push
            echo "✅ Market data pushed to repository"
          fi
