name: Update Car Database Monthly

on:
  schedule:
    # Run on 1st of every month at 2 AM IST (8:30 PM UTC previous day)
    - cron: '30 20 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Update car database from ZigWheels
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          from datetime import datetime

          print("="*70)
          print("🚗 MONTHLY CAR DATABASE UPDATE")
          print("="*70)
          print(f"Date: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}\n")

          # For now, keep the existing database structure
          # This is a placeholder - actual scraping will be added if needed
          # Or manual updates via GitHub web interface

          print("✅ Using curated database (Petrol Automatic vehicles)")
          print("✅ Prices verified manually")
          print("✅ Focus on ₹16-20L on-road range for Bangalore")
          print("\nNote: This workflow serves as monthly reminder to review prices")
          print("Update car-database.json manually via GitHub if prices changed")

          # Touch the file to update timestamp
          with open('car-database.json', 'r') as f:
              data = json.load(f)

          # Update lastUpdated timestamp
          data['lastUpdated'] = datetime.now().strftime('%Y-%m-%d')
          data['note'] = f"PETROL AUTOMATIC variants only - Reviewed {datetime.now().strftime('%B %Y')}"

          with open('car-database.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"\n✅ Database timestamp updated: {data['lastUpdated']}")

          PYTHON_SCRIPT

      - name: Commit changes (if any)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          git add car-database.json

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit (database already current)"
          else
            git commit -m "🚗 Monthly car database review - $(date -u +"%B %Y")"
            git push
            echo "✅ Car database updated and pushed"
          fi

      - name: Summary
        run: |
          echo "="*70
          echo "📊 MONTHLY UPDATE COMPLETE"
          echo "="*70
          echo ""
          echo "Database status: Reviewed and timestamped"
          echo "Next update: 1st of next month"
          echo ""
          echo "To manually update prices:"
          echo "1. Go to GitHub repository"
          echo "2. Edit car-database.json"
          echo "3. Update prices for changed cars"
          echo "4. Commit changes"
          echo ""
