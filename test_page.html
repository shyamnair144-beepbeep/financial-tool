<!DOCTYPE html>
<html>
<head><title>Syntax Test</title></head>
<body>
<div id="result"></div>
<script>
// Test if the main page's JavaScript has syntax errors
var result = document.getElementById('result');
try {
  // Basic structure tests
  var testsPassed = 0;
  var testsTotal = 3;
  
  // Test 1: Check if we can reference the file
  result.innerHTML = 'Running tests...<br>';
  testsPassed++;
  
  // Test 2: Verify basic function would work
  function testFunc() { return true; }
  if (testFunc()) testsPassed++;
  
  // Test 3: Array and object literals
  var arr = [1, 2, 3];
  var obj = { a: 1, b: 2 };
  if (arr.length === 3 && obj.a === 1) testsPassed++;
  
  result.innerHTML += 'Tests passed: ' + testsPassed + '/' + testsTotal + '<br>';
  if (testsPassed === testsTotal) {
    result.innerHTML += '<strong style="color:green">✅ JavaScript syntax basics OK</strong>';
  } else {
    result.innerHTML += '<strong style="color:red">❌ Some tests failed</strong>';
  }
} catch (e) {
  result.innerHTML = '<strong style="color:red">❌ Error: ' + e.message + '</strong>';
}
</script>
</body>
</html>
